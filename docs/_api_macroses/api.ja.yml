            "/api/v1/map/terrain":
                desc: |
                    指定されたマップの完全な地形とフロアグリッドデータを返します。
                    
                    **データフォーマットに関する注記:** 帯域幅を最適化するため、このエンドポイントは **ラン・レングス・エンコーディング（RLE）** と **パレットマッピング** を使用します。

                    - `palette`: 一意の地形定義のリスト（例：「Soil」、「WaterDeep」）。
                    - `grid`: マップセルを表す整数の圧縮リスト。フォーマットは `[count, palette_index]` のペアです。
                    
                    デコード例：グリッド `[10, 0, 5, 2]` は「palette[0] の 10 セル、その後 palette[2] の 5 セル」を意味します。
