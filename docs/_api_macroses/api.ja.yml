        PawnController:
            title: |
                ### :material-account: Pawn コントローラー
            desc: |
                **Pawn コントローラー** は入植者、囚人、動物、および敵に関する詳細な統計情報を取得するための 
                **読み取り専用** インターフェイスです。

                以下を深掘りで提供します:

                *   **ニーズ:** 空腹、休息、娯楽。
                *   **バイオ:** 年齢、特性、バックストーリー。
                *   **仕事:** 現在のジョブ、優先度、スケジュール。

            "/api/v2/colonists/detailed":
                desc: |
                    ニーズ（睡眠、喜び、美しさ）、仕事優先度、および医療状態を含む詳細な統計情報を備えた 
                    すべての入植者の包括的なリストを取得します。
                    
                    !!! info "キャッシュポリシー"
                        このエンドポイントはサーバー側で **1800 ゲームティック** （約 30 秒）キャッシュされ、ゲームループに対するパフォーマンスの影響を減らします。
                curl: |
                    **例:**
                    ```bash
                    curl --request GET \
                    --url http://localhost:8765/api/v2/colonists/detailed
                    ```
                request: ""
                response: |
                    **レスポンス:**
