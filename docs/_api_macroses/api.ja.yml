        ServerCacheController:
            title: |
                ### :material-server-network: Server Cache コントローラー
            desc: |
                API の内部キャッシュ機構を管理するためのエンドポイントです。これらのルートを使ってキャッシュの有効化/無効化、
                パフォーマンス統計（ヒット/ミス比）の監視、キャッシュの手動フラッシュによるメモリ解放やデータ強制更新を行えます。
            
            "/api/v1/cache/enable":
                desc: |
                    エンドポイント結果のサーバーキャッシュを有効にします。有効時は、適切な GET リクエストがメモリに保存され、サーバー負荷の軽減と応答時間の改善が図られます。
                curl: |
                    **例:**
                    ```bash
                    curl --request POST \
                    --url http://localhost:8765/api/v1/cache/enable
                    ```
                request: ""
                response: |
                    **レスポンス:**
                    ```json
                    {
                        "success": true,
                        "errors": [],
                        "warnings": [],
                        "timestamp": "2025-12-08T19:13:29.997162Z"
                    }
                    ```

            "/api/v1/cache/disable":
                desc: |
                    サーバーキャッシュを無効化します。これによりサーバーはすべてのリクエストを再処理します。デバッグや開発中にリアルタイムデータの正確性を確保する際に有用です。
                curl: |
                    **例:**
                    ```bash
                    curl --request POST \
                    --url http://localhost:8765/api/v1/cache/disable
                    ```
                request: ""
                response: |
                    **レスポンス:**
                    ```json
                    {
                        "success": true,
                        "errors": [],
                        "warnings": [],
                        "timestamp": "2025-12-08T19:13:29.997162Z"
                    }
                    ```

            "/api/v1/cache/status":
                desc: |
                    API の内部キャッシュシステムの現在の状態とパフォーマンス統計を取得します。キャッシュの利用状況、効果、およびメモリフットプリントに関する可視性を提供し、API のパフォーマンス監視やデバッグに役立ちます。
                curl: |
                    **例:**
                    ```bash
                    curl --request GET \
                    --url http://localhost:8765/api/v1/cache/status
                    ```
                request: ""
                response: |
                    **レスポンス:**
                    ```json
                    {
                        "enabled": true,
                        "statistics": {
                            "total_entries": 0,
                            "hits": 0,
                            "misses": 0,
                            "memory_usage_bytes": 0,
                            "last_cleanup": "2025-12-10T18:43:21.4353167Z",
                            "hit_ratio": 0.0,
                            "compiled_delegate_count": 0,
                            "compiled_delegate_hits": 0,
                            "compiled_delegate_misses": 0
                        }
                    }
                    ```

            "/api/v1/cache/clear":
                desc: |
                    キャッシュシステムの完全なフラッシュを手動でトリガーします。
                    これによりすべての格納エントリが削除され、実行時統計がリセットされます。
                curl: |
                    **例:**
                    ```bash
                    curl --request POST \
                    --url http://localhost:8765/api/v1/cache/clear
                    ```
                request: ""
                response: |
                    **レスポンス:**
                    ```json
                    {
                        "enabled": true,
                        "statistics": {
                            "total_entries": 0,
                            "hits": 0,
                            "misses": 0,
                            "memory_usage_bytes": 0,
                            "last_cleanup": "2025-12-10T18:43:21.4353167Z",
                            "hit_ratio": 0.0,
                            "compiled_delegate_count": 0,
                            "compiled_delegate_hits": 0,
                            "compiled_delegate_misses": 0
                        }
                    }
                    ```

        GameController:
            title: |
