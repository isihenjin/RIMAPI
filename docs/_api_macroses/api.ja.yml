        ImageController:
            title: |
                ### :material-image: Image コントローラー
            desc: |
                ゲームから視覚的アセットとテクスチャを抽出するためのエンドポイントを提供します。
                これは、RimWorld で使用されている実際のテクスチャを取得してゲームマップやアイテムを視覚的にレンダリングする必要がある外部ツールに不可欠です。

            "/api/v1/terrain/image":
                desc: |
                    特定の地形定義のテクスチャイメージを Base64 形式で取得します。
                    `name` パラメータは地形の `defName` に対応します（例：`Soil`、`WaterDeep`、`Sand`）。
                curl: |
                    **例:**
                    ```bash
                    curl --request GET \
                    --url "http://localhost:8765/api/v1/terrain/image?name=Soil"
                    ```
                request: ""
                response: |
                    **レスポンス:**
                    ```json
                    {
                        "success": true,
                        "data": {
                            "name": "Soil",
                            "image_base64": "iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0..."
                        },
                        "errors": [],
                        "warnings": [],
                        "timestamp": "2025-12-14T14:15:30.000Z"
                    }
                    ```

