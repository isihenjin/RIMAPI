        GameEventsController:
            title: |
                ### :material-flash: Game Events Controller
            desc: |
                **Game Events Controller** は外部システムが「ストーリーテラー」として振る舞い、特定のインシデントを即時発生させることを可能にします。
                
                !!! tip "ナラティブ制御"
                    Twitch連携やシナリオマネージャーが襲撃、天候変化、ドロップポッドなどをオンデマンドで発生させたい場合に有用です。

                **サポートされるイベントタイプ:**

                1.  **脅威:** 襲撃、マンハンター、害虫。
                2.  **天候:** 雨、霧、日食、太陽フレア。
                3.  **その他:** 商人到着、クエストトリガー。

