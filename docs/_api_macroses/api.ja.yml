        MapController:
            title: |
                ### :material-map-legend: Map コントローラー
            desc: |
                **map_id** で選択された **ローカル** マップに焦点を当てます。これは植民地の直近のエリアの物理的な地形と状態を処理します。

                !!! abstract "スコープ"
                    このコントローラーは、その中の *エンティティ* ではなく、*環境* を扱います。ポーンまたはアイテムについては、それぞれのコントローラーを参照してください。
                
                **機能:**

                *   ローカル天気を変更します。
                *   マップサイズと境界を照会します。
                *   地形を変更します（床の設置、デブリの除去）。

