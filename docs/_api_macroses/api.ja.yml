            "/api/v1/game/start":
                desc: |
                     指定された構成パラメータで新しい RimWorld ゲームを開始します。指定したストーリーテラー、難易度、マップ設定、惑星生成パラメータにより新しい世界を初期化します。

                     !!! info "利用可能なオプションの取得"
                         ストーリーテラー名、難易度レベル、その他の定義値は `/api/v1/def/all` エンドポイントから取得できます。本エンドポイントはゲームの定義を総合的に返し、

                         - **ストーリーテラー定義**
                         - **難易度設定**

                         **使用例:**
                         ```bash
                         curl --request GET \
                         --url http://localhost:8765/api/v1/def/all
                         ```

                         レスポンスはゲームからの大きなJSON構造で、ゲーム開始リクエストのパラメータを埋めるためのカテゴリ化された定義を含みます。
                curl: |
                    **例:**
                    ```bash
                    curl --request POST \
                    --url http://localhost:8765/api/v1/game/start \
                    --header 'Content-Type: application/json' \
                    --data '{
                        "storyteller_name": "Randy",
                        "difficulty_name": "Peaceful",
                        "map_size": 120,
                        "permadeath": false,
                        "planet_coverage": 0.1,
                        "world_seed": "rickroll",
                        "starting_tile": "7298",
                        "starting_season": "2",
                        "overall_rainfall": 2,
                        "overall_temperature": 2,
                        "overall_population": 2,
                        "landmark_density": 2
                    }'
                    ```
                request: |
                    **リクエスト:**
                    ```json
                    {
                        "storyteller_name": "Randy",
                        "difficulty_name": "Peaceful",
                        "map_size": 120,
                        "permadeath": false,
                        "planet_coverage": 0.1,
                        "world_seed": "rickroll",
                        "starting_tile": "7298",
                        "starting_season": "2",
                        "overall_rainfall": 2,
                        "overall_temperature": 2,
                        "overall_population": 2,
                        "landmark_density": 2
                    }
                    ```
                response: |
                    **レスポンス:**
                    ```json
                    {
                        "success": true,
                        "errors": [],
                        "warnings": [],
                        "timestamp": "2025-12-20T10:03:00.000Z"
                    }
                    ```

