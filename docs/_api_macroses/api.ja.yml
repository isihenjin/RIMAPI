        CameraController:
            title: |
                ### :material-camera: Camera コントローラー
            desc: |
                ユーザーのゲーム内ビューを制御するためのエンドポイントを提供します。
                外部ツールからカメラを特定の座標へパンしたり、ズームレベルをプログラム的に調整できます。

            "/api/v1/camera/change/zoom":
                desc: |
