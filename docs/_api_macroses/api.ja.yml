api:
    page_title: |
        # API リファレンス
    section:
        Core_API:
            title: |
                ## コア API
            desc: ""

    controllers:
        General:
            title: |
                ### :material-cogs: General コントローラー
            desc: |
                **General コントローラー** は、特定のエンティティカテゴリに分類されない雑多なユーティリティ機能のエントリポイントを提供します。ゲームクライアントの「メタ」レイヤーを扱います。
                
                !!! info "主な機能"
                    *   **カメラ制御**: プレイヤーの視点のパン、ズーム、フォーカス。
                    *   **UI 管理**: インターフェイスの表示切替や特定メニューの開閉。
                    *   **時間制御**: ゲーム速度の倍率を調整。

        DocumentationController:
            title: |
                ### :material-book-open-page-variant: Documentation コントローラー
            desc: |
                **Documentation コントローラー** は、API 自体のイントロスペクション機能を提供します。クライアントが外部参照なしで利用可能なエンドポイント、スキーマ、API バージョンを動的に発見できるようにします。

                | 機能 | 説明 |
                | :--- | :--- |
                | **検出 (Discovery)** | 登録されているルートとそのパラメータを一覧表示します。 |
                | **ヘルス** | API サーバーの状態をチェックします。 |
                | **スキーマ** | リクエスト/レスポンスボディの JSON スキーマを取得します。 |

            "/api/v1/core/docs/export":
                desc: |
                    利用可能なすべての API エンドポイントに関する包括的なドキュメントを生成してエクスポートします。
                    要求されたフォーマットでレスポンスとして返すと同時に、mod_path/docs/ ディレクトリにファイルとして保存します。
                curl: |
                    **例:**
                    ```bash
                    curl --request GET \
                    --url http://localhost:8765/api/v1/core/docs/export
                    ```
                request: ""
                response: ""

            "/api/v1/docs":
                desc: |
                    利用可能なすべての API エンドポイントに関するドキュメントを要求されたフォーマットで取得します。
                curl: |
                    **例:**
                    ```bash
                    curl --request GET \
                    --url http://localhost:8765/api/v1/docs
                    ```
                request: ""
                response: ""

            "/api/v1/docs/extensions/{extensionId}":
                desc: |
                    指定した拡張機能に関連する利用可能なエンドポイントのドキュメントを取得します。
                curl: |
                    **例:**
                    ```bash
                    curl --request GET \
                    --url http://localhost:8765/api/v1/docs/extensions/34
                    ```
                request: ""
                response: ""

            "/api/v1/docs/health":
                desc: |
                    API サーバーのヘルス情報を取得します。
                curl: |
                    **例:**
                    ```bash
                    curl --request GET \
                    --url http://localhost:8765/api/v1/docs/health
                    ```
                request: ""
                response: ""

            "/api/v1/docs/export":
                desc: |
                    ドキュメントをエクスポートします（フォーマット指定可）。
                curl: |
                    **例:**
                    ```bash
                    curl --request GET \
                    --url http://localhost:8765/api/v1/docs/export
                    ```
                request: ""
                response: ""

        BuilderController:
            title: |
                ### :material-hammer-wrench: Builder コントローラー
            desc: |
                **Builder コントローラー** は、プログラムによる構築・解体のためのツールを提供します。地形のコピー、貼り付け、青写真操作などを行えます。

            "/api/v1/builder/copy":
                desc: |
                    マップの指定領域（建物、アイテム、地形を含む）をコピーします。コピーしたデータは貼り付けエンドポイントで使用できます。
                curl: |
                    **例:**
                    ```bash
                    curl --request POST \
                    --url http://localhost:8765/api/v1/builder/copy \
                    --header 'content-type: application/json' \
                    --data '{
                        "from": { "x": 100, "z": 100 },
                        "to": { "x": 110, "z": 110 }
                    }'
                    ```
                request: |
                    **レスポンス:**
                    ```json
                    {
                        "map_id": 0,
                        "point_a": {"x": 10, "y": 0, "z": 10},
                        "point_b": {"x": 16, "y": 0, "z": 16}
                    }
                    ```
                response: |
                    **レスポンス:**
                    ```json
                    {
                        "success":true,
                        "data": {
                            "width":7,
                            "height":7,
                            "floors": [
                                {"def_name":"Concrete","rel_x":1,"rel_z":1},
                                {"def_name":"Concrete","rel_x":3,"rel_z":2}],
                            "buildings": [
                                {"def_name":"Wall","stuff_def_name":"WoodLog","rel_x":0,"rel_z":0,"rotation":0},
                                {"def_name":"Wall","stuff_def_name":"WoodLog","rel_x":3,"rel_z":0,"rotation":0},
                                {"def_name":"Wall","stuff_def_name":"WoodLog","rel_x":0,"rel_z":1,"rotation":0},
                            ]
                        },
                        "errors": [],
                        "warnings": [],
                        "timestamp": "2025-12-11T19:15:20.9851409Z"
                    }
                    ```

            "/api/v1/builder/paste":
                desc: |
                    以前にコピーした領域をマップ上の別の場所に貼り付けます。
                curl: |
                    **例:**
                    ```bash
                    curl --request POST \
                    --url http://localhost:8765/api/v1/builder/paste \
                    --header 'content-type: application/json' \
                    --data '{
                        "at": { "x": 150, "z": 150 }
                    }'
                    ```
                request: |
                    **リクエスト:**
                    ```json
                    {
                        "map_id": 0,
                        "position": {"x": 80, "y": 0, "z": 80},
                        "blueprint": {
                            "width":7,
                            "height":7,
                            "floors": [
                                {"def_name":"Concrete","rel_x":1,"rel_z":1},
                                {"def_name":"Concrete","rel_x":3,"rel_z":2}],
                            "buildings": [
                                {"def_name":"Wall","stuff_def_name":"WoodLog","rel_x":0,"rel_z":0,"rotation":0},
                                {"def_name":"Wall","stuff_def_name":"WoodLog","rel_x":3,"rel_z":0,"rotation":0},
                                {"def_name":"Wall","stuff_def_name":"WoodLog","rel_x":0,"rel_z":1,"rotation":0},
                            ]
                        },
                        "clear_obstacles": true,
                    }
                    ```
                response: |
                    **レスポンス:**
                    ```json
                    {
                        "success":true,
                        "errors":[],
                        "warnings":[],
                        "timestamp":"2025-12-31T12:18:40.2019606Z"
                    }
                    ```

            "/api/v1/builder/blueprint":
                desc: |
                    コピーした領域のための青写真を配置し、コロニストが建築できるようにします。
                curl: |
                    **例:**
                    ```bash
                    curl --request POST \
                    --url http://localhost:8765/api/v1/builder/blueprint \
                    --header 'content-type: application/json' \
                    --data '{
                        "at": { "x": 150, "z": 150 }
                    }'
                    ```
                request: |
                    **リクエスト:**
                    ```json
                    {
                        "map_id": 0,
                        "position": {"x": 80, "y": 0, "z": 80},
                        "blueprint": {
                            "width":7,
                            "height":7,
                            "floors": [
                                {"def_name":"Concrete","rel_x":1,"rel_z":1},
                                {"def_name":"Concrete","rel_x":3,"rel_z":2}],
                            "buildings": [
                                {"def_name":"Wall","stuff_def_name":"WoodLog","rel_x":0,"rel_z":0,"rotation":0},
                                {"def_name":"Wall","stuff_def_name":"WoodLog","rel_x":3,"rel_z":0,"rotation":0},
                                {"def_name":"Wall","stuff_def_name":"WoodLog","rel_x":0,"rel_z":1,"rotation":0},
                            ]
                        },
                    }
                    ```
                response: |
                    **レスポンス:**
                    ```json
                    {
                        "success":true,
                        "errors":[],
                        "warnings":[],
                        "timestamp":"2025-12-31T12:18:40.2019606Z"
                    }
                    ```

        DevToolsController:
            title: |
                ### :material-bug: DevTools コントローラー
            desc: |
                このコントローラーは RimWorld の内部 **デバッグアクション** と開発ツールを公開します。通常は開発者コンソール用の「God Mode」機能を提供します。

                !!! danger "注意して使用してください"
                    ここで実行されるアクションは標準のゲームプレイルールをバイパスします。誤用すると次のような影響があります:
                    *   セーブデータの破損。
                    *   ゲームクラッシュ。
                    *   AI の動作破壊。

            "/api/v1/dev/materials-atlas":
                desc: |
                    開発向けのマテリアルアトラスデータを取得します。これはマテリアル定義とグラフィック（テクスチャ、シェーダ、レンダリング特性）との内部マッピングを含みます。
                curl: |
                    **例:**
                    ```bash
                    curl --request GET \
                    --url http://localhost:8765/api/v1/dev/materials-atlas
                    ```
                request: ""
                response: |
                    **レスポンス:**
                    ```json
                    {
                        "success": true,
                        "data": {
                            "materials": [
                            "Custom/CutoutComplex_RockFlecked_Atlas",
                            "Custom/CutoutComplex_RockFlecked_Atlas",
                            "Custom/CutoutComplex_RockFlecked_Atlas",
                            "Custom/CutoutComplex_RockFlecked_Atlas",
                            "Custom/CutoutComplex_RockFlecked_Atlas",
                            "Custom/CutoutComplex_RockFlecked_Atlas",
                            "Custom/CutoutComplex_CompactedMachinery_Atlas",
                            "Custom/Cutout_Rock_Atlas",
                            "Custom/Cutout_Rock_Atlas",
                            "Custom/Cutout_Rock_Atlas",
                            "Custom/Cutout_Rock_Atlas",
                            "Custom/Cutout_Rock_Atlas",
                            "Custom/Cutout_Rock_Atlas",
                            "Custom/Cutout_AncientFence_Atlas",
                            "Custom/CutoutComplex_Fleshmass_Atlas",
                            "Custom/Transparent_PowerConduit_Blueprint_Atlas",
                            "Custom/Transparent_Sandbags_Blueprint_Atlas",
                            "Custom/Transparent_Barricade_Blueprint_Atlas",
                            "Custom/Transparent_Wall_Blueprint_Atlas",
                            "Custom/Transparent_Fence_Atlas_Smooth",
                            "Custom/Cutout_Wall_Atlas_Smooth",
                            "Custom/Cutout_Wall_Atlas_Bricks",
                            "Custom/Cutout_Wall_Atlas_Smooth",
                            "Custom/Cutout_Wall_Atlas_Bricks",
                            "Custom/Cutout_Wall_Atlas_Bricks"
                            ]
                        },
                        "errors": [],
                        "warnings": [],
                        "timestamp": "2025-12-11T19:15:20.9851409Z"
                    }
                    ```

            "/api/v1/dev/console":
                desc: |
                    開発およびデバッグ用のエンドポイントで、ゲームの内部ログシステムと対話できます。開発者コンソールをプログラムから操作し、ログ送信やコンソールのクリアなどを行えます。
                curl: |
                    **例:**
                    ```bash
                    curl --request POST \
                    --url 'http://localhost:8765/api/v1/dev/console'
                    ```
                request: |
                    **リクエスト:**
                    ```json
                    {
                    "action": "message",
                    "message": "hello_world"
                    }
                    ```
                response: |
                    **レスポンス:**
                    ```json
                    {
                        "success": true,
                        "errors": [],
                        "warnings": [],
                        "timestamp": "2025-12-08T19:13:29.997162Z"
                    }
                    ```

            "/api/v1/dev/stuff/color":
                desc: |
                    開発用ツールのエンドポイントで、ゲーム内の特定の「stuff」（素材）の視覚的な色プロパティを変更します。
                    RimWorld における "stuff" は、アイテムや構造物が作られる基礎素材（例: 木材、鋼、布、プラステル）を指します。
                    このエンドポイントは、素材の表示色をリアルタイムで調整するために使われます（主に視覚カスタマイズ、デバッグ、モッド開発テストに利用）。
                curl: |
                    **例:**
                    ```bash
                    curl --request POST \
                    --url http://localhost:8765/api/v1/dev/stuff/color \
                    --header 'content-type: application/json' \
                    --data '{
                        "name": "WoodLog",
                        "hex": "aa00ff"
                    }'
                    ```
                request: |
                    **リクエスト:**
                    ```json
                    {
                        "name": "WoodLog",
                        "hex": "aa00ff"
                    }
                    ```
                response: |
                    **レスポンス:**
                    ```json
                    {
                        "success": true,
                        "errors": [],
                        "warnings": [],
                        "timestamp": "2025-12-08T19:13:29.997162Z"
                    }
                    ```

            "/api/v1/dev/materials-atlas/clear":
                desc: |
                    メモリ内のマテリアルアトラスキャッシュをクリアし、必要に応じてディスクからマテリアルテクスチャやシェーダ、レンダリング特性を再読み込みするようにします。
                curl: |
                    **例:**
                    ```bash
                    curl --request POST \
                    --url http://localhost:8765/api/v1/dev/materials-atlas/clear
                    ```
                request: ""
                response: |
                    **レスポンス:**
                    ```json
                    {
                        "success": true,
                        "errors": [],
                        "warnings": [],
                        "timestamp": "2025-12-08T19:13:29.997162Z"
                    }
                    ```

        FactionController:
            title: |
                ### :material-flag: Faction コントローラー
            desc: |
                **Faction コントローラー** は、世界の地政学的な側面を管理します。プレイヤーのコロニーと他のグループ間の関係を検査・操作できます。
                
                **主な機能:**

                *   :handshake: **外交:** 好意度や関係ステータス（敵対/中立/同盟）を調整。
                *   :scroll: **レジストリ:** 生成された全派閥とそのリーダーを一覧表示。
                *   :busts_in_silhouette: **インタラクション:** 派閥固有の要求や贈り物をトリガー。

            "/api/v1/factions":
                desc: |
                    ゲーム世界で現在認識されている全派閥の一覧を取得します。
                curl: |
                    **例:**
                    ```bash
                    curl --request GET \
                    --url http://localhost:8765/api/v1/factions
                    ```
                request: ""
                response: |
                    **レスポンス:**
                    ```json
                    {
                        "success": true,
                        "data": [
                            {
                                "load_id": 0,
                                "def_name": "OutlanderCivil",
                                "name": "Western Haderia",
                                "is_player": false,
                                "relation": "Neutral",
                                "goodwill": 0
                            },
                            {
                                "load_id": 1,
                                "def_name": "TribeCivil",
                                "name": "Coalition of Tol",
                                "is_player": false,
                                "relation": "Neutral",
                                "goodwill": 0
                            },
                            {
                                "load_id": 2,
                                "def_name": "Empire",
                                "name": "Empire of Mophoos",
                                "is_player": false,
                                "relation": "Neutral",
                                "goodwill": 0
                            },
                            {
                                "load_id": 3,
                                "def_name": "PlayerColony",
                                "name": "New Arrivals",
                                "is_player": true,
                                "relation": "",
                                "goodwill": 0
                            }
                        ],
                        "errors": [],
                        "warnings": [],
                        "timestamp": "2025-12-11T19:21:17.8272328Z"
                    }
                    ```

            "/api/v1/faction/relations":
                desc: |
                    指定した派閥（idで選択）と他の全派閥との外交関係ステータスを取得します。
                curl: |
                    ```bash
                    curl --request GET \
                    --url http://localhost:8765/api/v1/faction/relations?id=2
                    ```
                request: |
                    ```json
                    {
                        "label": "lowercase label",
                        "message": "uppercase message",
                        "letter_def": "NeutralEvent"
                    }
                    ```
                response: |
                    ```json
                    {
                        "success": true,
                        "errors": [],
                        "warnings": [],
                        "timestamp": "2025-12-08T19:13:29.997162Z"
                    }
                    ```

