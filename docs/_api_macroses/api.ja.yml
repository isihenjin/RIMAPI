        TradeController:
            title: |
                ### :material-store: Trade コントローラー
            desc: |
                ゲームの経済と貿易システムへのアクセスを提供します。このコントローラーはさまざまなトレーダータイプ（軌道、キャラバン、訪問者）の定義を処理し、
                在庫生成ルール、アイテムコモンナリティ、買い/売り動作を分析できます。

                **機能:**

                * すべてのグローバルトレーダー種別（Defs）をリストします。
                * 在庫生成ロジック（特定のアイテム、カテゴリ、またはタグ）を検査します。
                * トレーダーのタイプが軌道ベースか陸上ベースかを決定します。

