                desc: |
                    すべてのトレーダー定義（TraderKindDefs）のリストを返します。これには軌道トレーダー、キャラバン、
                    訪問者が含まれ、在庫生成ルール、コモンナリティ、およびアイテムの特定のカテゴリを購入するかどうかが詳細に示されます。
                curl: |
                    **例:**
                    ```bash
                    curl --request GET \
