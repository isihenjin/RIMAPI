                    ```bash
                    curl --request GET \
                    --url http://localhost:8765/api/v1/game/state
                    ```
                request: ""
                response: |
                    **レスポンス:**
                    ```json
                    {
                        "success": true,
                        "data": {
                            "game_tick": 120,
                            "colony_wealth": 4.0,
                            "colonist_count": 3,
                            "storyteller": "Cassandra",
                            "is_paused": true
                        },
                        "errors": [],
                        "warnings": [],
                        "timestamp": "2025-12-11T19:39:28.6476222Z"
                    }
                    ```

